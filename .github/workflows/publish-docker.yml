# Build & push image Docker backend — GHCR (tags sha-* + latest sur main/master)
# Dans le VPS : GOLDYARA_BACK_IMAGE=ghcr.io/<owner_min>/goldyara-backend puis deploy.sh registry-up

name: Publish Docker image

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "pom.xml"
      - "mvnw"
      - "mvnw.cmd"
      - ".mvn/**"
      - "Dockerfile"
      - ".github/workflows/publish-docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: goldyara-back-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Image name (GHCR = minuscules)
        id: names
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${owner_lc}/goldyara-backend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Registry login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.ref_name == 'master' }}

      - name: Run tests (Maven)
        run: ./mvnw -B -ntp test

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Summary
        run: |
          {
            echo "### Image backend poussée"
            echo ""
            echo "- **Image** \`${{ steps.names.outputs.image }}\`"
            echo "- **Digest** \`${{ steps.push.outputs.digest }}\`"
            echo "- Rollback VPS : \`GOLDYARA_BACK_TAG=sha-xxxxxx\`"
          } >> "$GITHUB_STEP_SUMMARY"
