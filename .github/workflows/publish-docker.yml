# Build & push image Docker backend — GHCR (tags sha-* + branche ; pas de latest).
# Push main/master : deploiement SSH VPS obligatoire si VPS_DEPLOY_DISABLED != true
# (secrets manquants ou redeploy rate => workflow en echec).

name: Publish Docker image

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "pom.xml"
      - "mvnw"
      - "mvnw.cmd"
      - ".mvn/**"
      - "Dockerfile"
      - ".github/workflows/publish-docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: goldyara-back-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Image name (GHCR = minuscules)
        id: names
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${owner_lc}/goldyara-backend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Registry login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Run tests (Maven)
        run: chmod +x mvnw && ./mvnw -B -ntp test

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Summary
        run: |
          {
            echo "### Image backend poussée"
            echo ""
            echo "- **Image** \`${{ steps.names.outputs.image }}\`"
            echo "- **Digest** \`${{ steps.push.outputs.digest }}\`"
            echo "- Rollback VPS : éditer \`GOLDYARA_BACK_TAG=sha-xxxxxx\` dans deployment/.env puis \`compose up -d --force-recreate backend\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # --- Deploiement automatique VPS (push main/master) ---
  # Desactiver explicitement : variable repo VPS_DEPLOY_DISABLED=true
  deploy-vps:
    name: Deploy backend on VPS
    needs: docker-publish
    runs-on: ubuntu-latest
    if: |
      success() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      vars.VPS_DEPLOY_DISABLED != 'true'
    env:
      VPS_HEALTHCHECK_URL: ${{ vars.VPS_HEALTHCHECK_URL || 'https://goldyara.ma/api/actuator/health' }}
    steps:
      - name: Secrets VPS obligatoires
        env:
          H: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          U: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          K: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          G: ${{ secrets.GHCR_PULL_TOKEN }}
          PUB: ${{ vars.VPS_PUBLIC_GHCR_PACKAGES }}
        run: |
          set -e
          rc=0
          if [ -z "${H:-}" ]; then echo "::error::Manquant : VPS_HOST ou VPS_IP (secret ou variable repo)"; rc=1; fi
          if [ -z "${U:-}" ]; then echo "::error::Manquant : VPS_USER (secret ou variable repo)"; rc=1; fi
          if [ -z "${K:-}" ]; then echo "::error::Manquant : secret VPS_SSH_PRIVATE_KEY"; rc=1; fi
          if [ -z "${G:-}" ] && [ "${PUB:-}" != "true" ]; then
            echo "::error::Manquant : secret GHCR_PULL_TOKEN (ou variable repo VPS_PUBLIC_GHCR_PACKAGES=true si paquets publics sans login)"
            rc=1
          fi
          exit "$rc"

      - name: SSH — pull GHCR + force-recreate backend + verification
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ vars.VPS_SSH_PORT || '22' }}
          command_timeout: 25m
          envs: DEPLOY_PATH,GHCR_PULL_TOKEN,GITHUB_REPO_OWNER_LC,GITHUB_SHA_FULL,DEPLOY_HEALTHCHECK_URL,PUBLIC_GHCR
          script_stop: true
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH}" || { echo "ERREUR: cd ${DEPLOY_PATH}"; exit 1; }
            SHA_TAG="sha-$(printf '%s' "${GITHUB_SHA_FULL}" | cut -c1-7)"
            OWNER_LC=$(echo "${GITHUB_REPO_OWNER_LC}" | tr '[:upper:]' '[:lower:]')
            echo "==> Backend deploy  SHA=${SHA_TAG}  path=$(pwd)"
            if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
              echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "${OWNER_LC}" --password-stdin
            elif [ "${PUBLIC_GHCR:-}" = "true" ]; then
              echo "==> GHCR sans login (paquets publics)"
            else
              echo "::error::GHCR_PULL_TOKEN vide"
              exit 1
            fi
            set -a
            # shellcheck disable=SC1091
            [ -f .env ] && . ./.env
            set +a
            if [ -z "${GOLDYARA_BACK_IMAGE:-}" ]; then
              echo "ERREUR: deployment/.env doit contenir GOLDYARA_BACK_IMAGE=ghcr.io/${OWNER_LC}/goldyara-backend"
              exit 1
            fi
            if grep -q '^GOLDYARA_BACK_TAG=' .env 2>/dev/null; then
              sed -i "s/^GOLDYARA_BACK_TAG=.*/GOLDYARA_BACK_TAG=${SHA_TAG}/" .env
            else
              echo "GOLDYARA_BACK_TAG=${SHA_TAG}" >> .env
            fi
            echo "==> Tags dans .env (back + front) :"
            grep -n '^GOLDYARA_BACK_TAG=\|^GOLDYARA_FRONT_TAG=' .env || true
            echo "==> Image : ${GOLDYARA_BACK_IMAGE}:${SHA_TAG}"
            docker compose -f docker-compose.yml -f docker-compose.cd.yml pull backend
            docker compose -f docker-compose.yml -f docker-compose.cd.yml up -d --force-recreate --no-deps backend
            echo "==> Etat des services"
            docker compose -f docker-compose.yml -f docker-compose.cd.yml ps
            echo "==> Attente health backend (goldyara-backend)..."
            ok=""
            for i in $(seq 1 45); do
              st=$(docker inspect goldyara-backend --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' 2>/dev/null || echo missing)
              echo "  tentative ${i}/45 health=${st}"
              if [ "$st" = healthy ]; then ok=1; break; fi
              sleep 4
            done
            if [ "${ok:-}" != 1 ]; then
              echo "::error::backend pas healthy dans le delai"
              docker compose -f docker-compose.yml -f docker-compose.cd.yml logs backend --tail 120 || true
              exit 1
            fi
            docker compose -f docker-compose.yml -f docker-compose.cd.yml exec -T nginx nginx -s reload || true
            echo "==> Healthcheck HTTP public : ${DEPLOY_HEALTHCHECK_URL}"
            curl -fsS --max-time 45 "${DEPLOY_HEALTHCHECK_URL}"
            echo "OK backend redeploye et verifie."
        env:
          DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/goldyara/deployment' }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GITHUB_REPO_OWNER_LC: ${{ github.repository_owner }}
          GITHUB_SHA_FULL: ${{ github.sha }}
          DEPLOY_HEALTHCHECK_URL: ${{ vars.VPS_HEALTHCHECK_URL || 'https://goldyara.ma/api/actuator/health' }}
          PUBLIC_GHCR: ${{ vars.VPS_PUBLIC_GHCR_PACKAGES || 'false' }}

      - name: Resume deploy VPS
        run: |
          {
            echo "### Deploiement backend sur le VPS"
            echo ""
            echo "- **Tag** \`sha-$(echo '${{ github.sha }}' | cut -c1-7)\`"
            echo "- **Healthcheck HTTP** \`${{ vars.VPS_HEALTHCHECK_URL || 'https://goldyara.ma/api/actuator/health' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
