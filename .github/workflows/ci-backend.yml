name: Troco Backend Deploy

on:
  push:
    branches: [feature/shopify]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: troco-back-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/goldyara/deployment' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: |
      vars.VPS_DEPLOY_DISABLED != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jar
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp package -DskipTests

      - name: Prepare artifact
        run: |
          JAR_PATH=$(find target -maxdepth 1 -type f -name "*.jar" ! -name "original-*.jar" | sed -n '1p')
          if [ -z "${JAR_PATH:-}" ]; then
            echo "ERROR: no jar produced in target/"
            ls -la target || true
            exit 1
          fi
          cp "${JAR_PATH}" troco-backend.jar
          echo "JAR=$(du -sh troco-backend.jar | cut -f1)"

      - name: Validate VPS deploy config
        env:
          H: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          U: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          K: ${{ secrets.VPS_SSH_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -e
          rc=0
          [ -z "${H:-}" ] && echo "::error::Missing VPS_HOST" && rc=1
          [ -z "${U:-}" ] && echo "::error::Missing VPS_USER" && rc=1
          [ -z "${K:-}" ] && echo "::error::Missing VPS_SSH_PRIVATE_KEY" && rc=1
          exit "$rc"

      - name: Prepare VPS directories
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || vars.VPS_SSH_PORT || 22 }}
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/goldyara/deployment}"
            mkdir -p "${DEPLOY_PATH}/troco/backend" \
                     "${DEPLOY_PATH}/troco/frontend/dist" \
                     "${DEPLOY_PATH}/docker" \
                     "${DEPLOY_PATH}/nginx/conf.d" \
                     "${DEPLOY_PATH}/scripts" \
                     "${DEPLOY_PATH}/_troco_upload"
            rm -rf "${DEPLOY_PATH}/troco/backend/deploy-download" || true

      - name: Copy jar to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || vars.VPS_SSH_PORT || 22 }}
          source: "troco-backend.jar"
          target: "${{ env.DEPLOY_PATH }}/troco/backend/"

      - name: Upload Troco deployment sidecar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || vars.VPS_SSH_PORT || 22 }}
          source: "deployment/docker-compose.troco.yml,deployment/.env.troco.example,deployment/docker/nginx-internal-troco.conf,deployment/nginx/conf.d/troco.ma.vps.conf,deployment/scripts/bootstrap-troco-vps.sh"
          target: "${{ env.DEPLOY_PATH }}/_troco_upload/"
          strip_components: 1

      - name: Bootstrap env + restart troco-backend
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || vars.VPS_SSH_PORT || 22 }}
          command_timeout: 25m
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/goldyara/deployment}"
            LOG="${DEPLOY_PATH}/troco-backend-deploy.log"
            : > "${LOG}"
            exec > >(tee -a "${LOG}") 2>&1
            FINAL_PATH="${DEPLOY_PATH}/troco/backend/troco-backend.jar"
            UPLOAD="${DEPLOY_PATH}/_troco_upload"

            if [ ! -f "${FINAL_PATH}" ]; then
              FOUND=$(find "${DEPLOY_PATH}/troco/backend" -maxdepth 4 -type f -name "troco-backend.jar" | sed -n '1p')
              if [ -n "${FOUND:-}" ]; then
                mv -f "${FOUND}" "${FINAL_PATH}"
              fi
            fi
            rm -rf "${DEPLOY_PATH}/troco/backend/deploy-download" || true

            if [ ! -f "${FINAL_PATH}" ]; then
              echo "ERROR: JAR introuvable à ${FINAL_PATH}"
              find "${DEPLOY_PATH}/troco/backend" -maxdepth 4 -type f | sort || true
              exit 1
            fi
            echo "JAR OK: $(du -sh "${FINAL_PATH}" | cut -f1)"

            cd "${DEPLOY_PATH}"

            if [ -f "${UPLOAD}/docker-compose.troco.yml" ]; then
              cp -f "${UPLOAD}/docker-compose.troco.yml" ./docker-compose.troco.yml
            fi
            if [ -f "${UPLOAD}/.env.troco.example" ]; then
              cp -f "${UPLOAD}/.env.troco.example" ./.env.troco.example
            fi
            if [ -f "${UPLOAD}/docker/nginx-internal-troco.conf" ]; then
              mkdir -p docker
              cp -f "${UPLOAD}/docker/nginx-internal-troco.conf" ./docker/nginx-internal-troco.conf
            fi
            if [ -f "${UPLOAD}/nginx/conf.d/troco.ma.vps.conf" ]; then
              mkdir -p nginx/conf.d
              rm -f nginx/conf.d/troco.ma.vps.conf nginx/conf.d/troco*.vps.conf
              cp -f "${UPLOAD}/nginx/conf.d/troco.ma.vps.conf" nginx/conf.d/troco.ma.conf
              echo "nginx conf Troco mis à jour (getstore.codexa-solution.com)"
            fi
            if [ -f "${UPLOAD}/scripts/bootstrap-troco-vps.sh" ]; then
              mkdir -p scripts
              cp -f "${UPLOAD}/scripts/bootstrap-troco-vps.sh" ./scripts/bootstrap-troco-vps.sh
              chmod +x ./scripts/bootstrap-troco-vps.sh || true
            fi
            rm -rf "${UPLOAD}"

            if [ ! -f .env.troco ]; then
              if [ ! -f .env.troco.example ]; then
                echo "ERROR: .env.troco.example manquant"
                exit 1
              fi
              echo "Bootstrap .env.troco depuis example (secrets auto-générés)"
              cp .env.troco.example .env.troco
              JWT=$(openssl rand -hex 32)
              DBPASS=$(openssl rand -hex 18)
              MINIOPASS=$(openssl rand -hex 18)
              ADMINPASS=$(openssl rand -hex 12)
              SAPASS=$(openssl rand -hex 12)
              sed -i \
                -e "s|__CHANGE_ME_LONG_RANDOM_BASE64_OR_HEX__|${JWT}|g" \
                -e "s|__CHANGE_ME_ADMIN__|${ADMINPASS}|g" \
                -e "s|__CHANGE_ME_SUPER_ADMIN__|${SAPASS}|g" \
                -e "s|__CHANGE_ME_STRONG_DB_PASSWORD__|${DBPASS}|g" \
                -e "s|__CHANGE_ME_STRONG_MINIO_SECRET__|${MINIOPASS}|g" \
                .env.troco
              if [ -f .env ]; then
                for key in MAIL_HOST MAIL_PORT MAIL_USERNAME MAIL_PASSWORD MAIL_SSL MAIL_STARTTLS MAIL_SENDER_NAME; do
                  val=$(grep -E "^${key}=" .env | head -1 | cut -d= -f2- || true)
                  if [ -n "${val:-}" ]; then
                    if grep -qE "^${key}=" .env.troco; then
                      grep -vE "^${key}=" .env.troco > .env.troco.tmp || true
                      mv .env.troco.tmp .env.troco
                    fi
                    echo "${key}=${val}" >> .env.troco
                  fi
                done
                sed -i 's|__SAME_AS_GOLDYARA_MAIL_PASSWORD__||g' .env.troco || true
              fi
              echo "WARN: .env.troco créé — revue manuelle recommandée (APP_ADMIN_PASSWORD)"
            fi

            set_env_key() {
              key="$1"
              val="$2"
              if grep -qE "^${key}=" .env.troco 2>/dev/null; then
                grep -vE "^${key}=" .env.troco > .env.troco.tmp || true
                mv .env.troco.tmp .env.troco
              fi
              printf '%s=%s\n' "$key" "$val" >> .env.troco
            }
            set_env_key TROCO_DOMAIN getstore.codexa-solution.com
            set_env_key TROCO_WWW_DOMAIN getstore.codexa-solution.com
            set_env_key APP_PUBLIC_SITE_URL https://getstore.codexa-solution.com
            set_env_key APP_PLATFORM_DOMAIN getstore.codexa-solution.com
            set_env_key APP_CORS_ALLOWED_ORIGINS 'https://getstore.codexa-solution.com,https://*.getstore.codexa-solution.com,https://api.getstore.codexa-solution.com'
            set_env_key TROCO_MINIO_PUBLIC_ENDPOINT https://getstore.codexa-solution.com/files
            set_env_key MINIO_PUBLIC_ENDPOINT https://getstore.codexa-solution.com/files

            if [ ! -f docker-compose.troco.yml ]; then
              echo "ERROR: docker-compose.troco.yml manquant sous ${DEPLOY_PATH}"
              exit 1
            fi

            if [ -f docker-compose.yml ] && [ -f docker-compose.artifacts.yml ] && [ -f .env ]; then
              echo "Stack GoldYara détectée — compose fusionné (comme MizanePro)"
              COMPOSE=(docker compose --env-file .env --env-file .env.troco -f docker-compose.yml -f docker-compose.artifacts.yml -f docker-compose.troco.yml)
            else
              echo "Compose autonome -p troco (comme TerrainPro)"
              COMPOSE=(docker compose -f docker-compose.troco.yml --env-file .env.troco -p troco)
            fi

            echo "Démarrage troco-postgres / troco-minio..."
            "${COMPOSE[@]}" up -d troco-postgres troco-minio troco-minio-init

            echo "Recreate troco-backend..."
            "${COMPOSE[@]}" up -d --force-recreate --no-deps troco-backend

            if docker ps --format '{{.Names}}' | grep -qx goldyara-nginx; then
              echo "Reload nginx..."
              docker exec goldyara-nginx nginx -t && docker exec goldyara-nginx nginx -s reload \
                || echo "WARN: nginx -t/reload échoué (cert getstore manquant ?)"
            fi

            echo "Attente healthcheck troco-backend..."
            HEALTHY=""
            for i in $(seq 1 36); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' troco-backend 2>/dev/null || echo "unknown")
              echo "  [${i}/36] status=${STATUS}"
              if [ "${STATUS}" = "healthy" ]; then
                echo "troco-backend healthy"
                HEALTHY=1
                break
              fi
              if [ "${STATUS}" = "unhealthy" ]; then
                docker logs troco-backend --tail 120 || true
                exit 1
              fi
              sleep 5
            done
            if [ -z "${HEALTHY}" ]; then
              echo "Timeout healthcheck — logs:"
              docker logs troco-backend --tail 120 || true
              exit 1
            fi

            echo "Verification attachement reseau proxy..."
            if ! docker network inspect goldyara_goldyara-net --format '{{range .Containers}}{{.Name}} {{end}}' 2>/dev/null | grep -qw troco-backend; then
              echo "::error::troco-backend n'est pas attache au reseau goldyara_goldyara-net"
              docker inspect --format='{{json .NetworkSettings.Networks}}' troco-backend || true
              exit 1
            fi

            if docker ps --format '{{.Names}}' | grep -qx goldyara-nginx; then
              echo "Verification resolution depuis goldyara-nginx..."
              if ! docker exec goldyara-nginx sh -c "wget -q -T 5 -O- http://troco-backend:8080/api/actuator/health >/dev/null" 2>/dev/null; then
                echo "::error::goldyara-nginx ne joint pas troco-backend:8080 (502 probable)"
                exit 1
              fi
              echo "OK: goldyara-nginx joint troco-backend"
            fi

      - name: Publish remote log
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        id: remote_log
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || vars.VPS_SSH_PORT || 22 }}
          script_stop: true
          capture_stdout: true
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/goldyara/deployment}"
            LOG="${DEPLOY_PATH}/troco-backend-deploy.log"
            if [ ! -f "${LOG}" ]; then
              echo "NO_LOG"
              exit 0
            fi
            tail -n 120 "${LOG}" | grep -viE 'password|secret|jwt|authorization|mail_password' || true

      - name: Write remote log summary
        if: always()
        run: |
          {
            echo "### Remote backend log"
            echo '```'
            echo "${{ steps.remote_log.outputs.stdout }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy summary
        if: success()
        run: |
          {
            echo "### Troco backend déployé"
            echo ""
            echo "| Champ | Valeur |"
            echo "|-------|--------|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Path | \`${{ env.DEPLOY_PATH }}/troco/backend/troco-backend.jar\` |"
            echo "| Service | \`troco-backend\` |"
            echo "| API | \`https://api.getstore.codexa-solution.com\` |"
          } >> "$GITHUB_STEP_SUMMARY"
