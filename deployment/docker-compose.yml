# =============================================================================
# Troco — stack Docker (Postgres + MinIO + Backend + Frontend + Nginx)
# =============================================================================
# Local (build images) :
#   cp .env.example .env
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# VPS / CI (JAR + dist déjà présents) :
#   docker compose -f docker-compose.yml -f docker-compose.artifacts.yml up -d
# =============================================================================

name: troco

services:
  postgres:
    image: postgres:16-alpine
    container_name: troco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-troco}
      POSTGRES_USER: ${DB_USERNAME:-troco}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - troco-net

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: troco-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-trocominio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY required}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - troco-net

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-56Z
    container_name: troco-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        if [ "$${MINIO_PUBLIC_READ}" = "true" ]; then
          mc anonymous set download "local/$${MINIO_BUCKET}"
        fi
        echo "MinIO bucket ready: $${MINIO_BUCKET}"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-trocominio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY required}
      MINIO_BUCKET: ${MINIO_BUCKET:-troco-uploads}
      MINIO_PUBLIC_READ: ${MINIO_PUBLIC_READ:-true}
    networks:
      - troco-net
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:-troco-backend:local}
    container_name: troco-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-troco}
      DB_USERNAME: ${DB_USERNAME:-troco}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET required}
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-https://troco.ma/files}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-trocominio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY required}
      MINIO_BUCKET: ${MINIO_BUCKET:-troco-uploads}
      MINIO_AUTO_CREATE_BUCKET: "true"
      MINIO_PUBLIC_READ: ${MINIO_PUBLIC_READ:-true}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://troco.ma,https://www.troco.ma}
      APP_PUBLIC_SITE_URL: ${APP_PUBLIC_SITE_URL:-https://troco.ma}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SENDER_NAME: ${MAIL_SENDER_NAME:-Troco}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - troco-net

  frontend:
    image: ${FRONTEND_IMAGE:-troco-frontend:local}
    container_name: troco-frontend
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - troco-net

  nginx:
    image: nginx:1.27-alpine
    container_name: troco-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - minio
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - troco-net

volumes:
  postgres_data:
  minio_data:
  backend_logs:

networks:
  troco-net:
    driver: bridge
