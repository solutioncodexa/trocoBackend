# =============================================================================
# Overlay CI / VPS — JAR + dist déjà déployés (workflows GitHub Actions)
# =============================================================================
# Chemins :
#   ./troco/backend/troco-backend.jar
#   ./troco/frontend/dist/
#   ./nginx/frontend.conf
#
#   docker compose -f docker-compose.yml -f docker-compose.artifacts.yml up -d \
#     --force-recreate --no-deps backend
# =============================================================================

services:
  backend:
    image: eclipse-temurin:21-jre-alpine
    pull_policy: if_not_present
    user: "0:0"
    working_dir: /app
    volumes:
      - ./troco/backend/troco-backend.jar:/app/app.jar:ro
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache curl tzdata >/dev/null
        export TZ=Africa/Casablanca
        exec java -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -jar /app/app.jar

  frontend:
    image: nginx:1.27-alpine
    pull_policy: if_not_present
    volumes:
      - ./troco/frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started

volumes:
  backend_uploads:
