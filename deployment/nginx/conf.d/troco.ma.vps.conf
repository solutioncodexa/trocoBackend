# =============================================================================
# Domaines Troco / Matjarona (VPS GoldYara)
# DNS : getstore.codexa-solution.com + api.getstore.codexa-solution.com → VPS
# Fichier VPS UNIQUE : /opt/goldyara/deployment/nginx/conf.d/troco.ma.conf
# NE PAS laisser de copie *.vps.conf dans conf.d/ (nginx charge tous les *.conf).
#
# Résolution Docker DNS à la requête (pas d'upstream fixe).
# =============================================================================

# HTTP → ACME + redirect HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name getstore.codexa-solution.com api.getstore.codexa-solution.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Front + /api + /files
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name getstore.codexa-solution.com;

    ssl_certificate     /etc/letsencrypt/live/getstore.codexa-solution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getstore.codexa-solution.com/privkey.pem;

    client_max_body_size 50m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /api/ {
        limit_req zone=req_general burst=40 nodelay;
        set $troco_backend troco-backend;
        proxy_pass http://$troco_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location /files/ {
        set $troco_minio troco-minio;
        proxy_pass http://$troco_minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        set $troco_frontend troco-frontend;
        proxy_pass http://$troco_frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API dédiée
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.getstore.codexa-solution.com;

    ssl_certificate     /etc/letsencrypt/live/getstore.codexa-solution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getstore.codexa-solution.com/privkey.pem;

    client_max_body_size 50m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        set $troco_backend troco-backend;
        proxy_pass http://$troco_backend:8080/api/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        set $troco_backend troco-backend;
        proxy_pass http://$troco_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
