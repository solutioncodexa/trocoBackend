# =============================================================================
# Domaines Troco / Matjarona (VPS GoldYara)
# DNS : getstore.codexa-solution.com + api.getstore.codexa-solution.com → VPS
# Fichier VPS : /opt/goldyara/deployment/nginx/conf.d/troco.ma.conf
# Certificat :
#   certbot certonly --webroot -w /var/www/certbot \
#     -d getstore.codexa-solution.com -d api.getstore.codexa-solution.com \
#     --email contact@codexa-solution.com --agree-tos --non-interactive
# =============================================================================

upstream troco_frontend_upstream {
    server troco-frontend:80;
}

upstream troco_backend_upstream {
    server troco-backend:8080;
}

upstream troco_minio_upstream {
    server troco-minio:9000;
}

# HTTP → ACME + redirect HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name getstore.codexa-solution.com api.getstore.codexa-solution.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Front + /api + /files (même origine pour le SPA)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name getstore.codexa-solution.com;

    ssl_certificate     /etc/letsencrypt/live/getstore.codexa-solution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getstore.codexa-solution.com/privkey.pem;

    client_max_body_size 50m;

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /api/ {
        limit_req zone=req_general burst=40 nodelay;
        proxy_pass http://troco_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location /files/ {
        proxy_pass http://troco_minio_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://troco_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API dédiée (api.getstore.codexa-solution.com → backend)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.getstore.codexa-solution.com;

    ssl_certificate     /etc/letsencrypt/live/getstore.codexa-solution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getstore.codexa-solution.com/privkey.pem;

    client_max_body_size 50m;

    location = /healthz {
        access_log off;
        proxy_pass http://troco_backend_upstream/api/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://troco_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
