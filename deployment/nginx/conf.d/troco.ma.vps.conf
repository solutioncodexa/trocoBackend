# =============================================================================
# Vhost edge (nginx GoldYara) — Troco / Matjarona
# À placer sur le VPS : /opt/goldyara/deployment/nginx/conf.d/troco.ma.conf
# Puis : docker exec goldyara-nginx nginx -t && docker exec goldyara-nginx nginx -s reload
# Certificat : certbot (même stack Let's Encrypt que GoldYara)
# =============================================================================

upstream troco_frontend_upstream {
    server troco-frontend:80;
}

upstream troco_backend_upstream {
    server troco-backend:8080;
}

upstream troco_minio_upstream {
    server troco-minio:9000;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name troco.ma www.troco.ma;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name troco.ma www.troco.ma;

    ssl_certificate     /etc/letsencrypt/live/troco.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/troco.ma/privkey.pem;

    client_max_body_size 50m;

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /api/ {
        limit_req zone=req_general burst=40 nodelay;
        proxy_pass http://troco_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Fichiers MinIO : https://troco.ma/files/<bucket>/<object>
    location /files/ {
        proxy_pass http://troco_minio_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://troco_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
