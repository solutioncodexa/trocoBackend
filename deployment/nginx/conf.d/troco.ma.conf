# =============================================================================
# Reverse proxy Troco (HTTP)
# Placez vos certificats dans deployment/certs/ (fullchain.pem + privkey.pem)
# puis décommentez le bloc HTTPS ci-dessous.
# =============================================================================

upstream troco_frontend {
    server frontend:80;
}

upstream troco_backend {
    server backend:8080;
}

upstream troco_minio {
    server minio:9000;
}

server {
    listen 80;
    listen [::]:80;
    server_name troco.ma www.troco.ma localhost;

    # Healthcheck Docker / LB
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # API Spring Boot (context-path /api)
    location /api/ {
        proxy_pass http://troco_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Fichiers MinIO publics : https://troco.ma/files/<bucket>/<object>
    # Aligné avec MINIO_PUBLIC_ENDPOINT=https://troco.ma/files
    location /files/ {
        proxy_pass http://troco_minio/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Partage produit pour crawlers sociaux
    location ~ ^/produit/([0-9]+)$ {
        if ($social_crawler = 1) {
            proxy_pass http://troco_backend/api/share/produit/$1;
            break;
        }
        proxy_pass http://troco_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA frontend
    location / {
        proxy_pass http://troco_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

