# =============================================================================
# Nginx interne du conteneur troco-frontend (artifacts SPA)
# Backend Docker service name = troco-backend
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|gif|png|svg|webp|avif|ico|woff2?|ttf|otf|eot)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location ~ ^/produit/([0-9]+)$ {
        set $crawler 0;
        if ($http_user_agent ~* "(facebookexternalhit|facebot|whatsapp|twitterbot|linkedinbot|slackbot|telegrambot|discordbot)") {
            set $crawler 1;
        }
        if ($crawler = 1) {
            proxy_pass http://troco-backend:8080/api/share/produit/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            break;
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }
}
