# Profil test — H2 en mémoire, sans Flyway / Neon / MinIO / rate-limit
spring.main.banner-mode=off
spring.flyway.enabled=false
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

spring.datasource.url=jdbc:h2:mem:troco_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

server.servlet.context-path=/api
server.forward-headers-strategy=none

app.storage.type=local
app.upload.dir=target/test-uploads/
app.upload.optimize=false

app.jwt.secret=TestSecretKeyForJWTTokenGenerationMustBeLongEnoughForHS512Algorithm!!
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000
app.jwt.header=Authorization
app.jwt.prefix=Bearer

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

app.security.hsts-enabled=false
app.swagger.enabled=false
app.rate-limit.enabled=false

app.admin.email=admin@troco.ma
app.admin.password=Admin1234
app.super-admin.email=superadmin@matjarona.ma
app.super-admin.password=SuperAdmin1234

app.platform.domain=localhost
app.platform.name=Get STORE
app.platform.default-plan-code=basic

spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@localhost
spring.mail.password=test
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

spring.cache.type=none
spring.cache.cache-names=categories,heroCategories,homeHero,products,productById

logging.level.root=WARN
logging.level.ma.codexa.troco=INFO
logging.level.org.springframework.security=WARN
