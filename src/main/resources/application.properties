# ========================================
# APPLICATION TROCO E-COMMERCE
# Configuration COMMUNE (dev + prod)
# ----------------------------------------
# Aucun secret ne doit vivre ici.
# Les fichiers application-dev.properties et application-prod.properties
# fournissent les valeurs sp\u00e9cifiques \u00e0 chaque environnement.
# Le profil actif est s\u00e9lectionn\u00e9 via la variable SPRING_PROFILES_ACTIVE.
# ========================================

spring.application.name=troco

# Profil par d\u00e9faut (peut \u00eatre surcharg\u00e9 par SPRING_PROFILES_ACTIVE)
spring.profiles.default=dev

# ========================================
# SERVEUR
# ========================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api
# Derri\u00e8re reverse proxy (Nginx) : on respecte les en-t\u00eates X-Forwarded-*
server.forward-headers-strategy=framework
# R\u00e9duction de l'expo : pas de version de Tomcat/Java dans les erreurs
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.tomcat.relaxed-query-chars=[,]
# Pas de signature serveur "Tomcat" dans les en-t\u00eates HTTP
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-http-response-header-size=16384

# ========================================
# DATASOURCE (commun \u2014 valeurs concr\u00e8tes dans les profils)
# ========================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ========================================
# FLYWAY \u2014 migrations de sch\u00e9ma
# ========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# ========================================
# JPA / HIBERNATE \u2014 commun
# ========================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ========================================
# UPLOAD / STORAGE
# ========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:50MB}
spring.servlet.multipart.file-size-threshold=2KB

# Backend de stockage \u00e0 utiliser : "local" ou "minio".
app.storage.type=${STORAGE_TYPE:local}
# R\u00e9pertoire local (utilis\u00e9 si app.storage.type=local).
app.upload.dir=${UPLOAD_DIR:uploads/}
# Optimisation serveur (resize + WebP/JPEG)
app.upload.optimize=${UPLOAD_OPTIMIZE:true}
app.upload.max-edge=${UPLOAD_MAX_EDGE:2000}
app.upload.webp-quality=${UPLOAD_WEBP_QUALITY:0.82}
# Configuration MinIO (utilis\u00e9 si app.storage.type=minio).
app.storage.minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
app.storage.minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:}
app.storage.minio.access-key=${MINIO_ACCESS_KEY:}
app.storage.minio.secret-key=${MINIO_SECRET_KEY:}
app.storage.minio.bucket=${MINIO_BUCKET:troco-uploads}
app.storage.minio.region=${MINIO_REGION:us-east-1}
# Cr\u00e9e le bucket et applique une policy public-read au d\u00e9marrage si absent.
app.storage.minio.auto-create-bucket=${MINIO_AUTO_CREATE_BUCKET:true}
app.storage.minio.public-read=${MINIO_PUBLIC_READ:true}

# URL publique du site (Open Graph / partage Messenger, Facebook, WhatsApp)
app.site.public-url=${APP_PUBLIC_SITE_URL:https://troco.com}
app.site.public-name=${APP_PUBLIC_SITE_NAME:Troco}

# ========================================
# JACKSON
# ========================================
spring.jackson.time-zone=UTC
spring.jackson.serialization.fail-on-empty-beans=false

# ========================================
# CORS (origines autoris\u00e9es)
# ========================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://127.0.0.1:4200,http://localhost:5173,http://*.localhost:4200,http://*.localhost:5173}
app.cors.allowed-methods=${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
app.cors.allowed-headers=${APP_CORS_ALLOWED_HEADERS:*}
app.cors.allow-credentials=${APP_CORS_ALLOW_CREDENTIALS:true}

# ========================================
# JWT
# ========================================
# Secret OBLIGATOIRE en prod. La valeur par d\u00e9faut ne doit \u00eatre utilis\u00e9e qu'en dev local.
app.jwt.secret=${APP_JWT_SECRET:change-me-in-production-this-is-a-development-only-key-not-secure-at-all-32}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.header=Authorization
app.jwt.prefix=Bearer

# ========================================
# Identit\u00e9 application
# ========================================
app.name=${APP_NAME:Get STORE}
app.version=1.0.0
app.description=${APP_DESCRIPTION:Plateforme e-commerce multi-tenant Get STORE}

# ========================================
# Plateforme multi-tenant
# ========================================
app.platform.domain=${APP_PLATFORM_DOMAIN:getstore.com}
app.platform.name=${APP_PLATFORM_NAME:Get STORE}
app.platform.default-plan-code=${APP_DEFAULT_PLAN_CODE:basic}

# ========================================
# Identifiants Super Admin + admin (init au d\u00e9marrage)
# ========================================
app.super-admin.email=${APP_SUPER_ADMIN_EMAIL:}
app.super-admin.password=${APP_SUPER_ADMIN_PASSWORD:}
app.admin.email=${APP_ADMIN_EMAIL:admin@troco.ma}
app.admin.password=${APP_ADMIN_PASSWORD:}

# ========================================
# Headers de s\u00e9curit\u00e9
# ========================================
app.security.hsts-enabled=${APP_SECURITY_HSTS_ENABLED:true}

# ========================================
# Swagger / OpenAPI (d\u00e9sactiv\u00e9 par d\u00e9faut, override dans -dev)
# ========================================
app.swagger.enabled=${APP_SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${APP_SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${APP_SWAGGER_ENABLED:false}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false
springdoc.paths-to-exclude=/actuator/**,/error

# ========================================
# Actuator
# ========================================
management.endpoints.web.exposure.include=${MGMT_ENDPOINTS:health,info,metrics,prometheus}
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.info.git.mode=full
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.env=${SPRING_PROFILES_ACTIVE:dev}
management.tracing.sampling.probability=${TRACING_SAMPLING:0.1}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:}

# ========================================
# Cache
# ========================================
spring.cache.type=simple
spring.cache.cache-names=categories,heroCategories,homeHero,products,productById

# ========================================
# Rate limiting
# ========================================
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.requests-per-minute=${APP_RATE_LIMIT_RPM:100}
app.rate-limit.burst-capacity=${APP_RATE_LIMIT_BURST:150}

# ========================================
# Mail SMTP (valeurs concr\u00e8tes en env)
# ========================================
# Port 587 : STARTTLS (Gmail typique). Port 465 : SSL implicite (souvent ISP / hebergeur mail).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SSL_TRUST:*}
spring.mail.default-encoding=UTF-8

# En-tete From des mails (LWS / la plupart des SMTP : doit correspondre au compte authentifie MAIL_USERNAME)
app.mail.sender-name=${MAIL_SENDER_NAME:Get STORE}

# ========================================
# CMI — paiement abonnement boutique (NestPay 3D Pay Hosting)
# ========================================
app.cmi.enabled=${CMI_ENABLED:false}
# true = paiement simulé (pas de redirection CMI) — idéal pour les tests locaux
app.cmi.test-pass=${CMI_TEST_PASS:true}
app.cmi.gateway-url=${CMI_GATEWAY_URL:https://testpayment.cmi.co.ma/fim/est3Dgate}
app.cmi.client-id=${CMI_CLIENT_ID:}
app.cmi.store-key=${CMI_STORE_KEY:}
app.cmi.store-type=${CMI_STORE_TYPE:3d_pay_hosting}
app.cmi.currency=${CMI_CURRENCY:504}
app.cmi.lang=${CMI_LANG:fr}
app.cmi.hash-algorithm=${CMI_HASH_ALGORITHM:ver3}
app.cmi.ok-url=${CMI_OK_URL:http://127.0.0.1:8080/api/billing/cmi/ok}
app.cmi.fail-url=${CMI_FAIL_URL:http://127.0.0.1:8080/api/billing/cmi/fail}
app.cmi.callback-url=${CMI_CALLBACK_URL:http://127.0.0.1:8080/api/billing/cmi/callback}
