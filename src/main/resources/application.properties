# ========================================
# APPLICATION GOLDYARA E-COMMERCE
# ========================================

# Application Name
spring.application.name=goldyara

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# ========================================
# DATABASE CONFIGURATION - NEON POSTGRESQL
# ========================================
spring.datasource.url=jdbc:postgresql://ep-old-hat-agm0m40x-pooler.c-2.eu-central-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_FGLWe9T7Rpqa
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (optimis� pour Neon)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ========================================
# JPA / HIBERNATE CONFIGURATION
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ========================================
# LOGGING
# ========================================
logging.level.root=INFO
logging.level.ma.codexa.goldyara=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ========================================
# FILE UPLOAD CONFIGURATION
# ========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# Upload directory
app.upload.dir=uploads/

# ========================================
# JACKSON CONFIGURATION (JSON)
# ========================================
# Note: write-dates-as-timestamps is deprecated in Jackson 3
# Dates are serialized as ISO-8601 strings by default
spring.jackson.time-zone=UTC
spring.jackson.serialization.fail-on-empty-beans=false

# ========================================
# CORS CONFIGURATION
# ========================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173,https://goldyara.ma
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# ========================================
# JWT CONFIGURATION
# ========================================
# IMPORTANT: In production, use environment variables!
# export APP_JWT_SECRET=your-secure-secret-key
app.jwt.secret=${APP_JWT_SECRET:GoldYaraSecretKeyForJWTTokenGenerationMustBeLongEnoughForHS512Algorithm}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
app.jwt.header=Authorization
app.jwt.prefix=Bearer

# ========================================
# APPLICATION CUSTOM PROPERTIES
# ========================================
app.name=Goldyara
app.version=1.0.0
app.description=E-commerce de bijoux en or - Goldyara

# Admin credentials (use environment variables in production!)
# export APP_ADMIN_EMAIL=admin@goldyara.ma
# export APP_ADMIN_PASSWORD=your-secure-password
app.admin.email=${APP_ADMIN_EMAIL:admin@goldyara.ma}
app.admin.password=${APP_ADMIN_PASSWORD:}

# ========================================
# SPRING DOC OPENAPI CONFIGURATION
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false
springdoc.paths-to-exclude=/actuator/**,/error

# ========================================
# ACTUATOR CONFIGURATION (Secured)
# ========================================
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# ========================================
# CACHE CONFIGURATION
# ========================================
spring.cache.type=simple
spring.cache.cache-names=goldTypes,productTypes,categories,collections,goldPriceSetting

# ========================================
# RATE LIMITING CONFIGURATION
# ========================================
app.rate-limit.enabled=true
app.rate-limit.requests-per-minute=100
app.rate-limit.burst-capacity=150
