# ========================================
# APPLICATION GOLDYARA E-COMMERCE — PROFIL DEV
# Neon + reglages comme ancien application-local.
# Secrets DB / MAIL : fichier goldyara-dev-db.properties (gitignore) ou .env
# ========================================

spring.config.import=optional:file:goldyara-dev-db.properties,optional:file:.env

# Application Name
spring.application.name=goldyara

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# Reverse-proxy absent en local : sinon X-Forwarded-Proto/https fictif peut conduire
# a une reponse redirect (Chrome affiche souvent 307 Internal Redirect avant le backend).
server.forward-headers-strategy=none

# ========================================
# DATABASE CONFIGURATION - NEON POSTGRESQL
# ========================================
# Mot de passe : goldyara.dev.db.password dans goldyara-dev-db.properties ou DB_PASSWORD
goldyara.dev.db.url=jdbc:postgresql://ep-old-hat-agm0m40x-pooler.c-2.eu-central-1.aws.neon.tech/neondb?sslmode=require
goldyara.dev.db.username=neondb_owner

spring.datasource.url=${DB_URL:${goldyara.dev.db.url}}
spring.datasource.username=${DB_USERNAME:${goldyara.dev.db.username}}
spring.datasource.password=${DB_PASSWORD:${goldyara.dev.db.password}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (optimise pour Neon dev)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ========================================
# JPA / HIBERNATE CONFIGURATION
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ========================================
# LOGGING
# ========================================
logging.level.root=INFO
logging.level.ma.codexa.goldyara=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ========================================
# FILE UPLOAD CONFIGURATION
# ========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# Upload directory
app.upload.dir=uploads/

# ========================================
# JACKSON CONFIGURATION (JSON)
# ========================================
spring.jackson.time-zone=UTC
spring.jackson.serialization.fail-on-empty-beans=false

# ========================================
# CORS CONFIGURATION
# ========================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://127.0.0.1:4200,http://localhost:5173,https://goldyara.ma
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# ========================================
# JWT CONFIGURATION
# ========================================
app.jwt.secret=${APP_JWT_SECRET:GoldYaraSecretKeyForJWTTokenGenerationMustBeLongEnoughForHS512Algorithm}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.header=Authorization
app.jwt.prefix=Bearer

# ========================================
# APPLICATION CUSTOM PROPERTIES
# ========================================
app.name=GoldYara
app.version=1.0.0
app.description=E-commerce de bijoux en or - GoldYara

# Admin credentials (use environment variables in production!)
app.admin.email=${APP_ADMIN_EMAIL:admin@goldyara.ma}
app.admin.password=${APP_ADMIN_PASSWORD:}

# ========================================
# SPRING DOC OPENAPI CONFIGURATION
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false
springdoc.paths-to-exclude=/actuator/**,/error

# ========================================
# ACTUATOR CONFIGURATION (Secured)
# ========================================
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# ========================================
# CACHE CONFIGURATION
# ========================================
spring.cache.type=simple
spring.cache.cache-names=goldTypes,productTypes,categories,collections,goldPriceSetting,goldPriceHistory

# ========================================
# RATE LIMITING CONFIGURATION
# ========================================
app.rate-limit.enabled=true
app.rate-limit.requests-per-minute=100
app.rate-limit.burst-capacity=150

# ========================================
# MAIL CONFIGURATION (SMTP Gmail)
# ========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply.codexa@gmail.com}
# spring.mail.password : goldyara-dev-db.properties ou MAIL_PASSWORD (.env derriere import)
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.default-encoding=UTF-8

# HTTP local sans HSTS (base profil utilise true pour prod HTTPS)
app.security.hsts-enabled=false
