# ========================================
# APPLICATION TROCO E-COMMERCE — PROFIL DEV
# Neon + reglages comme ancien application-local.
# Secrets DB / MAIL : fichier troco-dev-db.properties (gitignore) ou .env
# ========================================

spring.config.import=optional:file:troco-dev-db.properties,optional:file:.env

# Application Name
spring.application.name=troco

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# Reverse-proxy absent en local : sinon X-Forwarded-Proto/https fictif peut conduire
# a une reponse redirect (Chrome affiche souvent 307 Internal Redirect avant le backend).
server.forward-headers-strategy=none

# ========================================
# DATABASE CONFIGURATION - NEON POSTGRESQL
# ========================================
# Mot de passe : troco.dev.db.password dans troco-dev-db.properties ou DB_PASSWORD
troco.dev.db.url=jdbc:postgresql://ep-lively-wave-axool097-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
troco.dev.db.username=neondb_owner

spring.datasource.url=${DB_URL:${troco.dev.db.url}}
spring.datasource.username=${DB_USERNAME:${troco.dev.db.username}}
spring.datasource.password=${DB_PASSWORD:${troco.dev.db.password}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (optimise pour Neon dev)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ========================================
# JPA / HIBERNATE CONFIGURATION
# ========================================
spring.jpa.hibernate.ddl-auto=update
# Flyway avant Hibernate (Boot 4) — journaliser les migrations en local
logging.level.org.flywaydb=INFO
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ========================================
# LOGGING
# ========================================
logging.level.root=INFO
logging.level.ma.codexa.troco=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ========================================
# FILE UPLOAD CONFIGURATION
# ========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# Upload directory
app.upload.dir=uploads/

# ========================================
# JACKSON CONFIGURATION (JSON)
# ========================================
spring.jackson.time-zone=UTC
spring.jackson.serialization.fail-on-empty-beans=false

# ========================================
# CORS CONFIGURATION
# ========================================
# Inclut http://*.localhost:4200 pour les vitrines multi-tenant (troco.localhost, etc.)
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://127.0.0.1:4200,http://localhost:5173,http://*.localhost:4200,http://*.localhost:5173,https://troco.ma,https://*.troco.ma,https://*.trycloudflare.com,https://*.ngrok-free.app,https://*.ngrok-free.dev,https://*.ngrok.io
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# ========================================
# JWT CONFIGURATION
# ========================================
app.jwt.secret=${APP_JWT_SECRET:TrocoSecretKeyForJWTTokenGenerationMustBeLongEnoughForHS512Algorithm}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.header=Authorization
app.jwt.prefix=Bearer

# ========================================
# APPLICATION CUSTOM PROPERTIES
# ========================================
app.name=Troco
app.version=1.0.0
app.description=Solutions d'emballage e-commerce - Troco

# Super Admin plateforme Get STORE (gère tous les fournisseurs)
app.super-admin.email=${APP_SUPER_ADMIN_EMAIL:superadmin@matjarona.ma}
app.super-admin.password=${APP_SUPER_ADMIN_PASSWORD:SuperAdmin1234}

# Admin credentials (dev defaults — override with APP_ADMIN_* in production)
# Dev : ADMIN du fournisseur démo Troco (tenant)
app.admin.email=${APP_ADMIN_EMAIL:admin@troco.ma}
app.admin.password=${APP_ADMIN_PASSWORD:Admin1234}

# Domaine plateforme (landing Get STORE + résolution sous-domaines)
app.platform.domain=${APP_PLATFORM_DOMAIN:localhost}
app.platform.name=${APP_PLATFORM_NAME:Get STORE}
app.platform.default-plan-code=${APP_DEFAULT_PLAN_CODE:basic}

# ========================================
# SPRING DOC OPENAPI CONFIGURATION
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false
springdoc.paths-to-exclude=/actuator/**,/error

# ========================================
# ACTUATOR CONFIGURATION (Secured)
# ========================================
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# ========================================
# CACHE CONFIGURATION
# ========================================
spring.cache.type=simple
spring.cache.cache-names=categories,heroCategories,homeHero,products,productById

# ========================================
# RATE LIMITING CONFIGURATION
# ========================================
app.rate-limit.enabled=true
app.rate-limit.requests-per-minute=300
app.rate-limit.burst-capacity=400

# ========================================
# MAIL CONFIGURATION (SMTP Gmail)
# ========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply.codexa@gmail.com}
# spring.mail.password : troco-dev-db.properties ou MAIL_PASSWORD (.env derriere import)
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.default-encoding=UTF-8

# HTTP local sans HSTS (base profil utilise true pour prod HTTPS)
app.security.hsts-enabled=false
