# ========================================
# PROFIL PROD \u2014 D\u00c9PLOIEMENT VPS goldyara.ma
# Activer avec : SPRING_PROFILES_ACTIVE=prod
# ----------------------------------------
# Aucune valeur sensible n'est en clair :
#   tout vient des variables d'environnement (.env / docker-compose).
# ========================================

# ----- Datasource : variables OBLIGATOIRES en prod -----
# DB_URL doit pointer sur le service postgres du docker-compose, ex :
#   DB_URL=jdbc:postgresql://postgres:5432/goldyara
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Pool plus large en prod
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}

# ----- Flyway -----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# ----- JPA / Hibernate -----
# "validate" en prod : Flyway g\u00e8re le DDL, Hibernate v\u00e9rifie seulement.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.generate_statistics=false

# ----- Logging \u2014 JSON via logback-spring.xml -----
logging.level.root=INFO
logging.level.ma.codexa.goldyara=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=INFO
# Pas de pattern console : g\u00e9r\u00e9 par logback-spring.xml (encoder JSON)

# ----- Swagger : OFF en prod (override par variable si besoin de debug temporaire) -----
app.swagger.enabled=${APP_SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${APP_SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${APP_SWAGGER_ENABLED:false}

# ----- HSTS activ\u00e9 (HTTPS uniquement) -----
app.security.hsts-enabled=true

# ----- CORS : domaines de prod uniquement -----
# Override via APP_CORS_ALLOWED_ORIGINS si besoin de subdomains
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://goldyara.ma,https://www.goldyara.ma}

# ----- Storage : MinIO -----
app.storage.type=${STORAGE_TYPE:minio}

# ----- Actuator restreint -----
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.env.show-values=NEVER
management.info.env.enabled=false
# SMTP externe ne doit pas faire \u00e9chouer /actuator/health (Docker healthcheck).
management.health.mail.enabled=false

# ----- Tracing : \u00e9chantillonnage prod -----
management.tracing.sampling.probability=${TRACING_SAMPLING:0.1}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://otel-collector:4318/v1/metrics}
management.otlp.metrics.export.step=60s

# ----- Devtools : OFF en prod (Maven exclut d\u00e9j\u00e0 mais ceinture+bretelles) -----
spring.devtools.add-properties=false
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ----- Mail : variables obligatoires en prod -----
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
# Nom affiche dans From (l'adresse utilisee est MAIL_USERNAME — a aligner avec LWS)
app.mail.sender-name=${MAIL_SENDER_NAME:GoldYara}

# ----- Erreurs : cache total -----
server.error.include-message=never
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

# ----- Compression de la r\u00e9ponse pour \u00e9conomiser la bande passante -----
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css,image/svg+xml
server.compression.min-response-size=1024
